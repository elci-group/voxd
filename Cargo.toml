[package]
name = "voxd"
version = "0.2.6"
edition = "2021"
license = "MIT"
default-run = "voxd"

[[bin]]
name = "voxd"
path = "src/main.rs"

[[bin]]
name = "voxd-cli"
path = "src/cli/main.rs"

[features]
default = []

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.13", features = ["json", "blocking", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
libc = "0.2"
futures-util = "0.3"
bytes = "1"

[dev-dependencies]
tempfile = "3"
